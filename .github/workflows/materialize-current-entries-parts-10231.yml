name: Materialize current entries transport

on:
  push:
    branches:
      - maintenance/national-2026-11-10-noon-10231
    paths:
      - data/current_entries.parts/**
      - .github/workflows/materialize-current-entries-parts-10231.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize and verify canonical file
        shell: bash
        run: |
          set -euo pipefail
          cat data/current_entries.parts/part-* > /tmp/current_entries.json.xz
          xz -t /tmp/current_entries.json.xz
          xz -dc /tmp/current_entries.json.xz > data/current_entries.json
          test "$(git hash-object data/current_entries.json)" = "6a31a3c93fd087238d4392ed523e5f1bd676627e"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_entries.json
          git commit -m "Materialize accepted current entries for publication"
          git push origin HEAD:maintenance/national-2026-11-10-noon-10231

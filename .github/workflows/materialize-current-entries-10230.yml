name: Materialize accepted current entries

on:
  push:
    branches:
      - maintenance/national-20261110-0610
    paths:
      - data/current_entries.json.gz

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact canonical JSON
        shell: bash
        run: |
          gzip -dc data/current_entries.json.gz > data/current_entries.json
          test "$(git hash-object data/current_entries.json)" = "7c3690d028ccbede2babb9fba63860f05e3d3c7f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_entries.json
          git commit -m "Materialize accepted canonical current entries"
          git push origin "HEAD:${GITHUB_REF_NAME}"

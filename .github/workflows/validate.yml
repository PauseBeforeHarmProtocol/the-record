name: Validate Record release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python scripts/sync_source_ledger.py --check
      - run: python scripts/build_current_pages.py --check
      - run: python scripts/build_legacy_bridge.py --check
      - run: python scripts/package_current_release.py --check
      - run: python scripts/validate.py
      - run: node --check assets/site.js
      - run: node --check assets/truth-feed.js

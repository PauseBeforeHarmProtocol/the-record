name: Reconstruct and validate Record release
on:
  pull_request:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Restore exact reviewed canonical inputs
        env:
          EXPECTED_BASE: 13fff11e463f46c7fafd2bc3edc6f579068a8069
        run: |
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_BASE"
          cat .github/bootstrap/inputs.tar.gz.* > "$RUNNER_TEMP/inputs.tar.gz"
          echo "40ed54f234cbdcbca9bef8275493f57213f05a692a22aa326d027de61f0f5370  $RUNNER_TEMP/inputs.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/inputs.tar.gz"
          rm -r .github/bootstrap
          git show "$EXPECTED_BASE":.github/workflows/validate.yml > .github/workflows/validate.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Rebuild in deterministic acceptance order
        run: |
          python scripts/sync_source_ledger.py
          python scripts/apply_legacy_remediations.py --check
          python scripts/sync_legacy_data.py
          python scripts/build_archive_metrics.py
          python scripts/sync_readme_metrics.py
          python scripts/validate_federated_records.py --self-test
          python scripts/build_legacy_bridge.py
          python scripts/package_current_release.py
          python scripts/build_current_pages.py
          python scripts/validate.py
      - name: Verify exact locally accepted tree
        run: |
          git add -A
          test "$(git write-tree)" = "53ca4a2c4c2eec440a0f5c19e7fffce1f1629425"
      - name: Run complete acceptance suite
        env:
          RECORD_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python scripts/accept_release.py --receipt "$RUNNER_TEMP/acceptance.json"
      - name: Commit exact validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize exact validated release 10.46.0"
          git push origin HEAD:${{ github.head_ref }}
      - name: Preserve actual acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-receipt-bootstrap
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: error

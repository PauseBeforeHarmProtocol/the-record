name: Validate Record release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run complete acceptance suite
        env:
          RECORD_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/accept_release.py --receipt "$RUNNER_TEMP/acceptance.json"
      - name: Preserve actual acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-receipt
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: error

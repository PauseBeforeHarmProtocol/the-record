name: Finalize and validate Record release
on:
  pull_request:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Restore exact large generated files
        run: |
          cat .github/bootstrap/current_pack.gz.* | gzip -dc > artifacts/THE_RECORD_CURRENT_UPDATE_PACK_2026-09-10_v10.42.0.zip
          cat .github/bootstrap/national_pack.gz.* | gzip -dc > artifacts/THE_RECORD_NATIONAL_UPDATE_PACK_2026-09-10_v10.42.0.zip
          cat .github/bootstrap/national_page.gz.* | gzip -dc > national/index.html
          echo "fef92497d876e648d13de628905d94b3355e6ac2df3bc0c64144b9785a736708  artifacts/THE_RECORD_CURRENT_UPDATE_PACK_2026-09-10_v10.42.0.zip" | sha256sum -c -
          echo "d1672f247fc7649dbabee51b7b048fc097c1d4903f2095674a5f79c01d2bf193  artifacts/THE_RECORD_NATIONAL_UPDATE_PACK_2026-09-10_v10.42.0.zip" | sha256sum -c -
          echo "de488a383a486f924c0b3e3c283b82ea40575ac7ac2b48f5fb8efceeced62a4c  national/index.html" | sha256sum -c -
          rm -rf .github/bootstrap
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run complete acceptance suite
        env:
          RECORD_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python scripts/accept_release.py --receipt "$RUNNER_TEMP/acceptance.json"
      - name: Commit exact validated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize validated large release artifacts"
          git push origin HEAD:${{ github.head_ref }}
      - name: Preserve actual acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-receipt-bootstrap
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: error
